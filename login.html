<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión de Mantenimientos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background: linear-gradient(135deg, var(--primary-main), var(--primary-dark)); height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
        <div class="text-center" style="margin-bottom: 2rem; text-align: center;">
            <i class="fas fa-tools" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 1rem;"></i>
            <h2 style="color: var(--primary-main); font-weight: 700;">GRUPO ACASER</h2>
            <p style="color: var(--text-secondary);">Sistema de Gestión</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 13px; color: var(--text-muted);"></i>
                    <input type="email" id="email" class="form-control" style="padding-left: 40px;" placeholder="nombre@empresa.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 15px; top: 13px; color: var(--text-muted);"></i>
                    <input type="password" id="password" class="form-control" style="padding-left: 40px;" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem;">
                Iniciar Sesión
            </button>
        </form>

        <div id="error" class="alert alert-danger" style="display: none; margin-top: 1rem;"></div>

        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted);">
            <p style="margin-bottom: 0.5rem;"><strong>Credenciales Demo:</strong></p>
            <div style="display: flex; justify-content: space-between;">
                <span>admin@empresa.com</span>
                <code>admin123</code>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/services/auth.js';

        // Prellenar para demo
        document.getElementById('email').value = 'admin@empresa.com';
        // document.getElementById('password').value = 'admin123';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const errorDiv = document.getElementById('error');

            // UI Loading
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
            errorDiv.style.display = 'none';

            try {
                const result = await auth.login(email, password);
                
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    throw new Error(result.error || 'Credenciales incorrectas');
                }
            } catch (error) {
                console.error(error);
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
